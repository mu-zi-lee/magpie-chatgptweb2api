[include]
files=/app/docker/desktop.conf

[program:gateway]
command=/usr/local/bin/magpie web --addr 0.0.0.0:3430 --no-open --gateway
directory=/app
priority=50
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
