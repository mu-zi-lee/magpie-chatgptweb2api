[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/magpie-supervisord.pid

[program:display]
command=Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:window-manager]
command=fluxbox
priority=20
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=x11vnc -display :99 -localhost -forever -shared -rfbport 5900 -rfbauth /tmp/magpie-vnc-auth
priority=30
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
